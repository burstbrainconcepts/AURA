name: Android cloud build

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
      - "UPSTREAM_MANIFEST.md"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
      - "UPSTREAM_MANIFEST.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout AURA
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch pinned llama.cpp source
        run: |
          mkdir -p upstream/engines
          rm -rf upstream/engines/llama.cpp
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git upstream/engines/llama.cpp
          git -C upstream/engines/llama.cpp fetch --depth 1 origin 94f3af3d09e74a0fb35f703194318d3b4037714a
          git -C upstream/engines/llama.cpp checkout --detach 94f3af3d09e74a0fb35f703194318d3b4037714a
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Verify pinned llama.cpp checkout
        run: test -f upstream/engines/llama.cpp/include/llama.h && git -C upstream/engines/llama.cpp rev-parse HEAD
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble native Android APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
