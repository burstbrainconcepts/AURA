name: Desktop cloud builds

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop-build.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install
      - name: Build desktop application
        working-directory: desktop
        run: npm run tauri -- build
      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: aura-desktop-${{ runner.os }}
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
