[package]
name = "aura-desktop"
version = "0.2.0"
description = "AURA local-first assistant and device protection"
authors = ["Burst Brain Concepts"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
