services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aura_recovery
      POSTGRES_USER: aura_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - aura_recovery_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura_user -d aura_recovery"]
      interval: 5s
      timeout: 5s
      retries: 20

  recovery:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aura_user:${POSTGRES_PASSWORD:-change-this-local-password}@database:5432/aura_recovery
      AURA_COMMAND_PRIVATE_KEY_B64: ${AURA_COMMAND_PRIVATE_KEY_B64}
      AURA_BOOTSTRAP_ACCOUNT_ID: ${AURA_BOOTSTRAP_ACCOUNT_ID}
      AURA_BOOTSTRAP_ACCOUNT_TOKEN: ${AURA_BOOTSTRAP_ACCOUNT_TOKEN}
      PORT: 8787
    ports:
      - "8787:8787"
    restart: unless-stopped

volumes:
  aura_recovery_data:
